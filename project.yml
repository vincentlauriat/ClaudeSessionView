name: ClaudeSessionView
options:
  bundleIdPrefix: fr.vincentlauriat
  deploymentTarget:
    macOS: "26.0"

schemes:
  ClaudeSessionView:
    build:
      targets:
        ClaudeSessionView: all
    run:
      config: Debug

targets:
  ClaudeSessionView:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: ClaudeSessionView
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: ClaudeSessionView
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.claudesessionview
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_ENTITLEMENTS: ClaudeSessionView/ClaudeSessionView.entitlements
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: ClaudeSessionView/Info.plist
      properties:
        CFBundleName: ClaudeSessionView
        CFBundleDisplayName: Claude Session View
        CFBundleIdentifier: fr.vincentlauriat.claudesessionview
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHumanReadableCopyright: ""
